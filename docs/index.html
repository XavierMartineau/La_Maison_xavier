<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101820" />
    <meta
      name="description"
      content="Choisissez votre langue pour entrer dans La Maison."
    />
    <title>La Maison | Choisir la langue</title>
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <main class="language-page">
      <header class="hero">
        <p class="eyebrow">Une histoire interactive</p>
        <h1>La Maison</h1>
        <p class="hero-copy">
          Une porte. Deux langues. Une maison pleine de secrets.
        </p>
      </header>

      <section class="language-choice" aria-labelledby="language-title">
        <p class="section-label" id="language-title">Choisissez votre langue</p>
        <div class="lang-container">
          <a
            class="lang-btn"
            href="./html/accueil.html"
            onclick="localStorage.setItem('lang', 'fr')"
          >
            <span class="lang-code">FR</span>
            <span class="lang-name">Français</span>
            <span class="lang-arrow" aria-hidden="true">&rarr;</span>
          </a>

          <a
            class="lang-btn"
            href="./html/accueil.html"
            onclick="localStorage.setItem('lang', 'en')"
          >
            <span class="lang-code">EN</span>
            <span class="lang-name">English</span>
            <span class="lang-arrow" aria-hidden="true">&rarr;</span>
          </a>
        </div>
      </section>

      <p class="hint">Votre aventure commence ici</p>
    </main>

    <footer class="site-footer">
      <p class="footer_info">
        © 2024–2026 Projet "La Maison". Xavier Martineau
      </p>
    </footer>
  </body>
</html>
