<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-lang="etageTitle">Étage</title>
    <link rel="stylesheet" href="../css/jeu.css" />
  </head>

  <body>
    <!-- Header -->
    <header>
      <h1 data-lang="etageTitle">L'Étage</h1>
    </header>

    <!-- Main avec image et texte -->
    <main>
      <div class="main-container">
        <!-- Petite boîte pour l'image -->
        <div class="image-box">
          <img src="../images/05.jpg" alt="Image de l'étage" />
        </div>

        <!-- Texte à côté -->
        <div class="text-box">
          <h2 data-lang="etageIntro">Vous avez choisi d'aller à l’étage</h2>

          <p>
            <span data-lang="etageText"
              >Vous regardez autour de vous et voyez deux chemins :</span
            >
            <span data-lang="etageChoice1">La Bibliothèque sombre</span>
            ou
            <span data-lang="etageChoice2">La Chambre</span>.
          </p>
        </div>
      </div>
    </main>

    <!-- Footer avec boutons -->
    <footer>
      <table>
        <tr>
          <td>
            <button class="Boutton-1">
              <a href="./jeu_bibliotheque.html" data-lang="btnBibli"
                >Vers la Bibliothèque</a
              >
            </button>
          </td>

          <td>
            <button class="Boutton-2">
              <a href="./jeu_chambre.html" data-lang="btnChambre"
                >Vers la Chambre</a
              >
            </button>
          </td>
        </tr>
      </table>

      <p class="footer_info" data-lang="footerInfoEtage">
        © 2024–2026 Projet "La Maison". Réalisé par Xavier Martineau.
      </p>
    </footer>

    <script src="../js/script.js"></script>
    <script src="../js/translate.js"></script>
  </body>
</html>
